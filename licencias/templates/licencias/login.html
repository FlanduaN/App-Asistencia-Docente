<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Asistencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-200">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold">
                🏫
            </div>
            <h2 class="text-2xl font-bold text-slate-900">Ingreso al Sistema</h2>
            <p class="text-xs text-slate-500 mt-1">Gestión Institucional de Asistencia Docente</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="p-3 mb-4 rounded-lg text-xs font-bold bg-red-50 text-red-700 border border-red-200">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Usuario (Correo o Legajo)</label>
                <input type="text" name="username" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" required>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Contraseña</label>
                <input type="password" name="password" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" required>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg transition-all shadow-md mt-2 text-sm">
                Ingresar al Sistema
            </button>
        </form>
    </div>

</body>
</html>
