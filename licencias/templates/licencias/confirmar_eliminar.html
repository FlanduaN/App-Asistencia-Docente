<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dar de baja Inasistencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans flex flex-col justify-center py-10 px-4">
    <div class="max-w-md mx-auto w-full bg-white p-8 rounded-2xl shadow-sm border border-red-200 text-center">
        <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
            ⚠️
        </div>
        <h2 class="text-xl font-bold text-slate-900 mb-2">¿Dar de baja esta inasistencia?</h2>
        <p class="text-sm text-slate-600 mb-6">
            Estás a punto de anular la licencia de <strong class="text-slate-900">{{ licencia.docente.user.get_full_name }}</strong> del día <strong>{{ licencia.fecha_solicitud|date:"d/m/Y" }}</strong>. El docente volverá a figurar como presente.
        </p>
        <form method="post" class="flex gap-3">
            {% csrf_token %}
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl transition-all">
                Sí, Anular Licencia
            </button>
            <a href="{% url 'dashboard_regencia' %}?fecha={{ licencia.fecha_solicitud|date:'Y-m-d' }}" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl transition-all">
                Cancelar
            </a>
        </form>
    </div>
</body>
</html>
